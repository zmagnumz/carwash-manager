<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="512" height="512" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="16" height="16" fill="#111827"/>

  <!-- Water drops falling (rows 0-3) -->
  <rect x="2"  y="0" width="1" height="1" fill="#93c5fd"/>
  <rect x="6"  y="1" width="1" height="1" fill="#60a5fa"/>
  <rect x="9"  y="0" width="1" height="1" fill="#93c5fd"/>
  <rect x="13" y="1" width="1" height="1" fill="#60a5fa"/>

  <rect x="1"  y="2" width="1" height="2" fill="#3b82f6"/>
  <rect x="4"  y="2" width="1" height="2" fill="#3b82f6"/>
  <rect x="7"  y="2" width="1" height="2" fill="#2563eb"/>
  <rect x="11" y="2" width="1" height="2" fill="#3b82f6"/>
  <rect x="14" y="2" width="1" height="2" fill="#3b82f6"/>

  <!-- CAR -->
  <!-- Roof (row 4, cols 5-8) -->
  <rect x="5" y="4" width="4" height="1" fill="#fbbf24"/>

  <!-- Upper cabin (row 5, cols 3-11) -->
  <rect x="3" y="5" width="9" height="1" fill="#fbbf24"/>

  <!-- Window row (row 6) -->
  <rect x="2"  y="6" width="2" height="1" fill="#fbbf24"/>  <!-- left body -->
  <rect x="4"  y="6" width="2" height="1" fill="#7dd3fc"/>  <!-- left window -->
  <rect x="6"  y="6" width="2" height="1" fill="#d97706"/>  <!-- center pillar -->
  <rect x="8"  y="6" width="2" height="1" fill="#7dd3fc"/>  <!-- right window -->
  <rect x="10" y="6" width="2" height="1" fill="#fbbf24"/>  <!-- right body -->

  <!-- Main body (row 7, cols 1-12) -->
  <rect x="1" y="7" width="12" height="1" fill="#fbbf24"/>

  <!-- Lower body (row 8, cols 0-13) -->
  <rect x="0" y="8" width="14" height="1" fill="#fbbf24"/>

  <!-- Bumper + wheel wells (row 9) -->
  <rect x="0"  y="9" width="1" height="1" fill="#d97706"/>   <!-- left bumper -->
  <rect x="1"  y="9" width="2" height="1" fill="#1f2937"/>   <!-- left wheel -->
  <rect x="3"  y="9" width="7" height="1" fill="#fbbf24"/>   <!-- body -->
  <rect x="10" y="9" width="2" height="1" fill="#1f2937"/>   <!-- right wheel -->
  <rect x="12" y="9" width="2" height="1" fill="#d97706"/>   <!-- right bumper -->

  <!-- Wheel bottoms (row 10) -->
  <rect x="1"  y="10" width="2" height="1" fill="#1f2937"/>
  <rect x="10" y="10" width="2" height="1" fill="#1f2937"/>

  <!-- Wheel rims -->
  <rect x="2"  y="9" width="1" height="1" fill="#6b7280"/>
  <rect x="11" y="9" width="1" height="1" fill="#6b7280"/>

  <!-- Ground line (row 11) -->
  <rect x="0" y="11" width="14" height="1" fill="#374151"/>

  <!-- Water + foam (rows 12-13) -->
  <rect x="0" y="12" width="16" height="2" fill="#1e3a5f"/>
  <rect x="0"  y="12" width="2" height="1" fill="#bae6fd"/>
  <rect x="3"  y="12" width="3" height="1" fill="#bae6fd"/>
  <rect x="7"  y="12" width="2" height="1" fill="#bae6fd"/>
  <rect x="10" y="12" width="3" height="1" fill="#bae6fd"/>
  <rect x="14" y="12" width="2" height="1" fill="#bae6fd"/>

  <!-- Pixel sparkle (cross) top-right -->
  <rect x="13" y="4" width="1" height="3" fill="#fde68a"/>
  <rect x="12" y="5" width="3" height="1" fill="#fde68a"/>

  <!-- Small sparkle dot -->
  <rect x="15" y="2" width="1" height="1" fill="#fde68a"/>
  <rect x="0"  y="0" width="1" height="1" fill="#fde68a"/>
</svg>
